<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
</head>
<body>
<h2>Đăng ký tài khoản</h2>
<form action="#" method="POST">
    <fieldset>
        <legend>Thông tin cá nhân</legend>
        <label for="fullname">Họ và tên:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên" required minlength="2" maxlength="50"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Nhập email" required><br><br>

        <label for="phone">Số điện thoại:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" pattern="[0-9]{10}" required><br><br>

        <label for="date">Ngày sinh:</label><br>
        <input type="date" id="date" name="date" max="2026-04-27" required><br><br>
    </fieldset>

    <fieldset>
        <legend>Tài khoản</legend>

        <label for="username">Tên đăng nhập:</label><br>
        <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" pattern="^[a-zA-Z0-9_]{3,20}$" required><br><br>

        <label for="password">Mật khẩu:</label><br>
        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" minlength="8" pattern ="^(?=.[A-Z])(?=.*[0-9]).{8,}$" required><br><br>

        <label for="confirm_password">Xác nhận mật khẩu:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Xác nhận mật khẩu" pattern ="^(?=.[A-Z])(?=.*[0-9]).{8,}$" required><br><br>
    </fieldset>

    <fieldset>
        <legend>Thông tin giao hàng</legend>

        <label for="city">Thành phố</label><br>
        <select id="city" name="city" required>
            <option value="">Chọn thành phố</option>
            <option value="hanoi">Hà Nội</option>
            <option value="hcm">Hồ Chí Minh</option>
            <option value="danang">Đà Nẵng</option>
            <option value="hue">Huế</option>
            <option value="cantho">Cần Thơ</option>
        </select><br><br>

        <label for="district">Quận/Huyện</label><br>
        <select id="district" name="district">
            <option value="">Chọn quận/huyện</option>
            <option value="district1">Quận 1</option>
            <option value="district2">Quận 2</option>
        </select><br><br>

        <label for="adress">Địa chỉ chi tiết</label><br>
        <textarea id="adress" name="adress" rows="3" required></textarea><br><br>

        <p>Giới tính</p>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Nam</label><br>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Nữ</label><br>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Khác</label><br><br>
    </fieldset>

    <input type="checkbox" id="terms" name="terms" required>
    <label for="terms">Tôi đồng ý với điều khoản và điều kiện</label><br><br>
    
    <button type="submit">Đăng ký</button>
    <button type="reset">Reset</button>

</form>
</body>
</html>
