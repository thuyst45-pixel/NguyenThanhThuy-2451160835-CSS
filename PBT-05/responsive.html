<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>

    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <header class="header">

        <div class="logo">
            Shop
        </div>

        <nav class="nav">

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <button class="hamburger">
                ☰
            </button>

        </nav>

    </header>

    <div class="layout">

        <aside class="sidebar">

            <h3>Filters</h3>

            <label><input type="checkbox"> Shoes</label>
            <label><input type="checkbox"> Clothes</label>
            <label><input type="checkbox"> Bags</label>
            <label><input type="checkbox"> Watches</label>

        </aside>

        <main class="product-grid">

            <div class="card">
                <img src="https://picsum.photos/300/200?1" alt="">
                <h3>Product 1</h3>
                <p>$25</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?2" alt="">
                <h3>Product 2</h3>
                <p>$30</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?3" alt="">
                <h3>Product 3</h3>
                <p>$40</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?4" alt="">
                <h3>Product 4</h3>
                <p>$22</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?5" alt="">
                <h3>Product 5</h3>
                <p>$55</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?6" alt="">
                <h3>Product 6</h3>
                <p>$28</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?7" alt="">
                <h3>Product 7</h3>
                <p>$60</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?8" alt="">
                <h3>Product 8</h3>
                <p>$45</p>
            </div>

        </main>

        <aside class="ads">

            <h3>Advertisement</h3>

            <img src="https://picsum.photos/200/400" alt="">

        </aside>

    </div>

    <footer class="footer">

        <p>
            Responsive Product Page
        </p>

    </footer>

</body>
</html>
