<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <!-- Logo -->
        <div class="logo">
            LOGO
        </div>

        <!-- Menu -->
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <!-- Auth Buttons -->
        <div class="auth-buttons">
            <button class="btn login">Login</button>
            <button class="btn register">Register</button>
        </div>

    </nav>

    <!-- Product Grid -->
    <section class="products">

        <!-- Card 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Product">

            <div class="card-content">
                <h3>Gaming Laptop</h3>
                <p class="price">$1200</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Product">

            <div class="card-content">
                <h3>Wireless Mouse</h3>
                <p class="price">$45</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Product">

            <div class="card-content">
                <h3>Mechanical Keyboard</h3>
                <p class="price">$90</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Product">

            <div class="card-content">
                <h3>Monitor 27 Inch</h3>
                <p class="price">$300</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <!-- Card 5 -->
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Product">

            <div class="card-content">
                <h3>Headphones</h3>
                <p class="price">$150</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <!-- Card 6 -->
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Product">

            <div class="card-content">
                <h3>Smartphone</h3>
                <p class="price">$850</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <!-- Card 7 -->
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Product">

            <div class="card-content">
                <h3>Tablet</h3>
                <p class="price">$500</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

        <!-- Card 8 -->
        <div class="card">
            <img src="https://via.placeholder.com/250x180" alt="Product">

            <div class="card-content">
                <h3>Webcam HD</h3>
                <p class="price">$75</p>

                <button class="buy-btn">Mua</button>
            </div>
        </div>

    </section>

</body>
</html>
