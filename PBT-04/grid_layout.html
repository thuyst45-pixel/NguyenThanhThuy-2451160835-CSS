<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid E-Commerce Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h1>E-Commerce Store</h1>
        </header>

        <!-- Hero Banner -->
        <section class="hero">
            <h2>BIG SALE 50% OFF</h2>
            <p>Shop the latest products today!</p>
        </section>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Filters</h2>

            <label>
                <input type="checkbox">
                Gaming
            </label>

            <label>
                <input type="checkbox">
                Laptop
            </label>

            <label>
                <input type="checkbox">
                Smartphone
            </label>

            <label>
                <input type="checkbox">
                Accessories
            </label>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="products">

                <!-- Card 1 -->
                <div class="card">
                    <img src="https://via.placeholder.com/250x180" alt="product">
                    <h3>Gaming Laptop</h3>
                    <p>$1200</p>
                    <button>Buy Now</button>
                </div>

                <!-- Card 2 -->
                <div class="card">
                    <img src="https://via.placeholder.com/250x180" alt="product">
                    <h3>Mechanical Keyboard</h3>
                    <p>$90</p>
                    <button>Buy Now</button>
                </div>

                <!-- Card 3 -->
                <div class="card">
                    <img src="https://via.placeholder.com/250x180" alt="product">
                    <h3>Gaming Mouse</h3>
                    <p>$45</p>
                    <button>Buy Now</button>
                </div>

                <!-- Card 4 -->
                <div class="card">
                    <img src="https://via.placeholder.com/250x180" alt="product">
                    <h3>Monitor 27"</h3>
                    <p>$300</p>
                    <button>Buy Now</button>
                </div>

                <!-- Card 5 -->
                <div class="card">
                    <img src="https://via.placeholder.com/250x180" alt="product">
                    <h3>Wireless Headphones</h3>
                    <p>$150</p>
                    <button>Buy Now</button>
                </div>

                <!-- Card 6 -->
                <div class="card">
                    <img src="https://via.placeholder.com/250x180" alt="product">
                    <h3>Smartphone</h3>
                    <p>$850</p>
                    <button>Buy Now</button>
                </div>

            </div>

        </main>

        <!-- Ads -->
        <aside class="ads">
            <h2>Advertisement</h2>

            <img src="https://via.placeholder.com/180x400" alt="ads">
        </aside>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 E-Commerce Store. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
